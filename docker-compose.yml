services:
  mysql:
    image: mysql:8.4
    container_name: disaster-alert-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: disaster_alert
      MYSQL_USER: disaster
      MYSQL_PASSWORD: disaster
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/disaster_alert?useSSL=false&serverTimezone=UTC
      DB_USERNAME: disaster
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
