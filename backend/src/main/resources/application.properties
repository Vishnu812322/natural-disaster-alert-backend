spring.application.name=disaster-alert-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/disaster_alert?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.otp.provider=${OTP_PROVIDER:console}
app.sms.enabled=${SMS_ENABLED:false}
app.fcm.enabled=${FCM_ENABLED:true}
app.fcm.project-id=${FIREBASE_PROJECT_ID:natural-disaster-alert-38cb7}


# Real Government CAP source
app.cap.ndma-rss-url=${NDMA_CAP_RSS_URL:https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
app.cap.poll-ms=${CAP_POLL_MS:300000}
app.cap.initial-delay-ms=${CAP_INITIAL_DELAY_MS:15000}

server.address=0.0.0.0
server.port=8080